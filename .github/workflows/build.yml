name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - name: Build
        run: |
          set -o pipefail
          gradle assembleRelease --stacktrace 2>&1 | tee build.log
      - name: Report errors
        if: failure()
        run: |
          grep -E "^e: |error:|ERROR|What went wrong" -A2 build.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
      - run: cp app/build/outputs/apk/release/app-release.apk ZadaniaSzachowe.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ZadaniaSzachowe
          path: ZadaniaSzachowe.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Zadania Szachowe 1.0.${{ github.run_number }}
          files: ZadaniaSzachowe.apk
