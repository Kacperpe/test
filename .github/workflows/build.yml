name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - name: Build
        run: |
          set -o pipefail
          gradle assembleRelease --stacktrace 2>&1 | tee build.log
      - name: Report errors
        if: failure()
        run: |
          msg=$(grep -E "^e: |What went wrong|error:" -A1 build.log | head -80 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error::$msg"
      - run: cp app/build/outputs/apk/release/app-release.apk ZadaniaSzachowe.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ZadaniaSzachowe
          path: ZadaniaSzachowe.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Zadania Szachowe 1.0.${{ github.run_number }}
          files: ZadaniaSzachowe.apk
